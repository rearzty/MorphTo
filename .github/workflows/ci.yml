name: CI

on:
  push:
    branches: [main, "port/**"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ["3.12", "3.14"]
        include:
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Cache FFmpeg
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\MorphTo\engines
          key: ffmpeg-${{ runner.os }}-v1
      - name: Install FFmpeg (for audio/video tests)
        if: runner.os == 'Windows'
        run: morphto engines install ffmpeg
      - name: Install FFmpeg and libarchive (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libarchive-tools libegl1 libxkbcommon0
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install -e . pyinstaller ziglang
      - name: Build
        run: python packaging/build.py
      - name: Self-test the packaged app
        run: |
          python -c "from PIL import Image; im = Image.new('RGB', (64, 48), 'teal'); im.save('sample.png'); im.save('sample.pdf')"
          dist\MorphTo\MorphTo.exe --self-test sample.png jpg | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dist\MorphTo\MorphTo.exe --self-test sample.pdf png | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the installer (catches installer script errors before a release)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Host }
          & $iscc /DAppVersion=0.0.0 packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: MorphTo-windows
          path: dist/MorphTo
