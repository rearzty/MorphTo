name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install -e . pyinstaller ziglang
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import morphto; print(morphto.__version__)"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$v") {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match version $v in src/morphto/__init__.py"; exit 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build the app
        run: python packaging/build.py
      - name: Self-test the packaged app
        shell: pwsh
        run: |
          python -c "from PIL import Image; im = Image.new('RGB', (64, 48), 'teal'); im.save('sample.png'); im.save('sample.pdf')"
          dist\MorphTo\MorphTo.exe --self-test sample.png jpg | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dist\MorphTo\MorphTo.exe --self-test sample.pdf png | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Host }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path dist\MorphTo -DestinationPath "dist\MorphTo-$v-portable.zip"
          # stable name, so "releases/latest/download/MorphTo-setup.exe" in the README always works
          Copy-Item "dist\MorphTo-$v-setup.exe" dist\MorphTo-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/MorphTo-setup.exe
            dist/MorphTo-*-setup.exe
            dist/MorphTo-*-portable.zip

  linux:
    runs-on: ubuntu-22.04  # the oldest glibc we support: the AppImage runs on anything newer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: System libraries for Qt (xcb) and the virtual screen
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libegl1 libdbus-1-3 xvfb
      - name: Install
        run: python -m pip install -e . pyinstaller
      - name: appimagetool
        run: |
          curl -sSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - name: Build
        run: python packaging/build.py
      - name: Self-test the packaged app
        run: |
          python -c "from PIL import Image; im = Image.new('RGB', (64, 48), 'teal'); im.save('sample.png'); im.save('sample.pdf')"
          xvfb-run -a ./dist/MorphTo-*.AppImage --self-test sample.png jpg
          xvfb-run -a ./dist/MorphTo-*.AppImage --self-test sample.pdf png
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/MorphTo-*.AppImage

  macos:
    strategy:
      matrix:
        runner: [macos-latest, macos-15-intel]  # Apple Silicon, Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install -e . pyinstaller
      - name: Build
        run: python packaging/build.py
      - name: Self-test the packaged app
        run: |
          python -c "from PIL import Image; im = Image.new('RGB', (64, 48), 'teal'); im.save('sample.png'); im.save('sample.pdf')"
          dist/MorphTo.app/Contents/MacOS/MorphTo --self-test sample.png jpg
          dist/MorphTo.app/Contents/MacOS/MorphTo --self-test sample.pdf png
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.runner }}
          path: dist/MorphTo-*.dmg

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          sha256sum $(ls | grep -v '^MorphTo-setup.exe$') > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          v = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[?{re.escape(v)}\]?.*?$\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          open("release-notes.md", "w", encoding="utf-8").write(m.group(1).strip() if m else f"MorphTo {v}")
          PY
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: MorphTo ${{ needs.windows.outputs.version }}${{ startsWith(needs.windows.outputs.version, '0.') && ' (beta)' || '' }}
          body_path: release-notes.md
          make_latest: true
          files: assets/*
